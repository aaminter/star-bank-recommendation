spring.application.name=star-bank-recommendation

spring.datasource.url=${DB_URL:jdbc:h2:file:./transaction;ACCESS_MODE_DATA=r;IFEXISTS=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.read-only=true

custom.datasource.recommendations.jdbc-url=${REC_DB_URL:jdbc:postgresql://localhost:5432/star_bank_db}
custom.datasource.recommendations.username=${REC_DB_USERNAME:rec_db_user}
custom.datasource.recommendations.password=${REC_DB_PASSWORD:}



custom.datasource.recommendations.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.url=${custom.datasource.recommendations.jdbc-url}
spring.liquibase.user=${custom.datasource.recommendations.username}
spring.liquibase.password=${custom.datasource.recommendations.password}
spring.liquibase.change-log=classpath:changelog/changelog-master.yml
spring.liquibase.default-schema=public

# Comma-separated Telegram operator user IDs. Empty means no one is authorized.
telegram.bot.allowed-user-ids=${TELEGRAM_BOT_ALLOWED_USER_IDS:}
