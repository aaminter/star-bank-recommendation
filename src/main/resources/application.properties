spring.application.name=star-bank-recommendation

spring.datasource.url=${DB_URL:jdbc:h2:file:./transaction;ACCESS_MODE_DATA=r;IFEXISTS=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.read-only=true

custom.datasource.recommendations.jdbc-url=jdbc:postgresql://localhost:5432/star_bank_db
custom.datasource.recommendations.username=rec_db_user
custom.datasource.recommendations.password=recpassword
custom.datasource.recommendations.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.url=jdbc:postgresql://localhost:5432/star_bank_db
spring.liquibase.user=rec_db_user
spring.liquibase.password=recpassword
spring.liquibase.change-log=classpath:changelog/changelog-master.xml
spring.liquibase.default-schema=public