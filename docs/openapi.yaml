openapi: 3.0.3
info:
  title: Star Bank Recommendation API
  version: 0.0.1-SNAPSHOT
  description: REST API for static and dynamic bank product recommendations.
servers:
  - url: http://localhost:8080
paths:
  /recommendation/{user_id}:
    get:
      summary: Get recommendations for a customer
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recommendation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
  /rule:
    post:
      summary: Create a dynamic rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRule'
      responses:
        '200':
          description: Created rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRule'
        '400':
          description: Invalid rule payload or condition
    get:
      summary: Get all dynamic rules
      responses:
        '200':
          description: Dynamic rules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DynamicRule'
  /rule/{id}:
    delete:
      summary: Delete a dynamic rule by database record ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Rule deleted
        '404':
          description: Rule not found
  /rule/stats:
    get:
      summary: Get dynamic rule hit statistics
      responses:
        '200':
          description: Rule statistics
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats:
                    type: array
                    items:
                      type: object
                      required: [rule_id, count]
                      properties:
                        rule_id:
                          type: string
                          description: Decimal string representation of the dynamic rule database ID (Long/BIGINT), not the product UUID
                        count:
                          type: string
                          description: Hit count serialized as a string
  /management/clear-caches:
    post:
      summary: Clear all registered recommendation caches
      responses:
        '204':
          description: All registered caches cleared
  /management/info:
    get:
      summary: Get Maven build metadata
      responses:
        '200':
          description: Build artifact and version
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                    example: star-bank-recommendation
                  version:
                    type: string
                    example: 0.0.1-SNAPSHOT
components:
  schemas:
    RecommendationResponse:
      type: object
      required: [user_id, recommendations]
      properties:
        user_id:
          type: string
          format: uuid
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
    Recommendation:
      type: object
      required: [name, id, text]
      properties:
        name:
          type: string
        id:
          type: string
          format: uuid
        text:
          type: string
    DynamicRule:
      type: object
      required: [product_name, product_id, product_text, rule]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        product_name:
          type: string
        product_id:
          type: string
          format: uuid
        product_text:
          type: string
        rule:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RuleCondition'
    RuleCondition:
      type: object
      required: [query, arguments, negate]
      properties:
        query:
          type: string
          enum:
            - USER_OF
            - ACTIVE_USER_OF
            - TRANSACTION_SUM_COMPARE
            - TRANSACTION_SUM_COMPARE_DEPOSIT_WITHDRAW
        arguments:
          type: array
          items:
            type: string
        negate:
          type: boolean
